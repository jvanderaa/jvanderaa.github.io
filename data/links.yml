# Links page data. Rendered by layouts/shortcodes/link-groups.html on content/links.md.
#
# Each group has:
#   id:    anchor for the jump nav
#   title: section heading
#   intro: optional sentence, Markdown allowed
#   note:  optional Markdown shown after the cards (tips, snippets)
#   items: list of links
#
# Each item has:
#   title: link text
#   url:   destination
#   note:  optional one-line description, Markdown allowed
#   by:    optional author or show name
#   social: optional {label, url} for a person's social profile
#   review: optional reason the link is a candidate for removal. Not rendered;
#           it is a reminder for the next cleanup pass. Checked 2026-11-21.

