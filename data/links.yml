- id: labs
  title: Labs and simulators
  note: |
    If you're connecting to GNS3 with Netmiko, this may help:

    ```python
    net_connect = ConnectHandler(
        device_type='generic_termserver_telnet',        # changed
        ip='127.0.0.1',
        username='pyclass',
        password='cisco',
        global_delay_factor=4,
        default_enter='\r\n',
        port=5000)
    ```
