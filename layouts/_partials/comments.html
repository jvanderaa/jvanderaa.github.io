<div id="giscus-comments"></div>
<script>
(function() {
  var container = document.getElementById('giscus-comments');
  if (!container) return;

  function getGiscusTheme() {
    return document.documentElement.classList.contains('dark') ? 'dark' : 'light';
  }

  function syncGiscusTheme() {
    var iframe = container.querySelector('iframe.giscus-frame');
    if (!iframe || !iframe.contentWindow) return;
    iframe.contentWindow.postMessage(
      { giscus: { setConfig: { theme: getGiscusTheme() } } },
      'https://giscus.app'
    );
  }

  var script = document.createElement('script');
  script.src = 'https://giscus.app/client.js';
  script.async = true;
  script.crossOrigin = 'anonymous';
  script.setAttribute('data-repo', 'jvanderaa/jvanderaa.github.io');
  script.setAttribute('data-repo-id', 'R_kgDOJuZTvA');
  script.setAttribute('data-category', 'Announcements');
  script.setAttribute('data-category-id', 'DIC_kwDOJuZTvM4CYqB6');
  script.setAttribute('data-mapping', 'pathname');
  script.setAttribute('data-strict', '0');
  script.setAttribute('data-reactions-enabled', '1');
  script.setAttribute('data-emit-metadata', '0');
  script.setAttribute('data-input-position', 'bottom');
  script.setAttribute('data-theme', getGiscusTheme());
  script.setAttribute('data-lang', 'en');
  container.appendChild(script);

  new MutationObserver(syncGiscusTheme).observe(document.documentElement, {
    attributes: true,
    attributeFilter: ['class']
  });

  window.addEventListener('message', function(event) {
    if (event.origin === 'https://giscus.app' && event.data && event.data.giscus) {
      syncGiscusTheme();
    }
  }, { once: true });
})();
</script>
